<!doctype html>
<html>
<head lang="en">
<title>Incline step</title>
<meta charset="utf-8" />
<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
<sdpi-item label="Step (%)"><sdpi-range setting="step" min="1" max="5" step="1" default="1" showlabels></sdpi-range></sdpi-item>
<sdpi-item label="Backend URL">
<sdpi-textfield setting="backendUrl" global placeholder="http://localhost:8000" default="http://localhost:8000"></sdpi-textfield>
</sdpi-item>
</body>
</html>
